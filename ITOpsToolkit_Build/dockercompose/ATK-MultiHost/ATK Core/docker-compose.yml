# =============================================================================
# ATK — CORE machine (10.106.6.15)
#
# Runs: Postgres, Vault, Keycloak, LiteLLM, Backend, KB-Sync, Grafana, nginx
# The Frontend + Admin Console run on the OTHER machine (10.106.6.228) —
# see ../ATK-Frontend/
#
# DNS records served by the nginx in this file (all -> 10.106.6.15):
#   sso-atkdev.fd.com       -> Keycloak        (/auth)
#   vault-atkdev.fd.com     -> Vault UI + API  (/)
#   backend-atkdev.fd.com   -> Backend API     (/api, /iac_assist_socket, /openapi.json)
#                              Grafana         (/grafana)
#                              LiteLLM         (/litellm)
#
# BEFORE YOU START — read the three sections below:
#
# [A] USING THIS AS-IS (default)
#     Postgres and Vault run as containers. Fill in .env and all config/
#     files, place SSL certs in ssl/, then run: docker compose up -d
#
# [B] IF YOU HAVE AN EXISTING POSTGRES
#     1. Comment out / delete the entire "postgres" service block below
#     2. Comment out postgres_data under volumes: at the bottom
#     3. On ALL services that have "depends_on: postgres:" — remove that block
#     4. Update DB_HOST and PGDB_HOST on backend and kb-sync (change "postgres"
#        to your external DB hostname/IP)
#     5. Update KC_DB_URL on keycloak (change "postgres" to your DB host)
#     6. Update DATABASE_URL on litellm (change "postgres" to your DB host)
#     7. Update config/litellm_config.yaml database_url with your DB host
#     8. Run init/01_init.sh manually against your postgres to create the
#        keycloak and litellm databases and enable the pgvector extension
#     !! pgvector MUST be installed in your postgres or RAG will not work !!
#
# [C] IF YOU HAVE AN EXISTING VAULT
#     1. Comment out / delete the entire "vault" service block below
#     2. Comment out vault_data under volumes: at the bottom
#     3. On backend depends_on — remove "vault: condition: service_started"
#     4. Update config/.vault_env: set VAULT_URL to your Vault server URL
#        and VAULT_TOKEN to your token (remove http://vault:8200)
#     5. In your Vault, create the secret path the backend reads from
#        and populate it with: MODEL, BASE_URL, API_KEY, API_TYPE,
#        AZ_API_VERSION (your LLM provider credentials)
#     6. Remove the vault-atkdev.fd.com server block from config/nginx.conf
#        (and you no longer need that DNS record)
# =============================================================================

services:

  # ─── INFRASTRUCTURE ──────────────────────────────────────────────────────────
  # ═══ [B] EXISTING POSTGRES? Remove this entire block ════════════════════════
  # Delete or comment out everything from "postgres:" down to "# END [B]" below.
  # Full checklist: see [B] at the TOP OF THIS FILE.
  # ─────────────────────────────────────────────────────────────────────────────

 # postgres:
 #   image: pgvector/pgvector:pg16       # Do NOT replace with plain postgres image —
                                        # pgvector extension is required for RAG search
 #   container_name: atk-postgres
 #   environment:
 #     POSTGRES_USER: ${POSTGRES_USER}           # set in .env
 #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # set in .env
 #     POSTGRES_DB: ${POSTGRES_DB}               # set in .env — this is the ATK main DB
 #   ports:
 #     - "5432:5432"
 #   volumes:
 #     - postgres_data:/var/lib/postgresql/data
 #     - ./init:/docker-entrypoint-initdb.d      # runs init/01_init.sh on first boot only
                                                # creates keycloak_db and litellm_db
                                                # [B] if using existing DB: run this script
                                                #     manually against your postgres instead
 #   networks:
 #     - atk-network
 #   restart: unless-stopped
 #   healthcheck:
 #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
 #     interval: 10s
 #     timeout: 5s
 #     retries: 10
  # END [B] postgres ────────────────────────────────────────────────────────────

  # ═══ [C] EXISTING VAULT? Remove this entire block ════════════════════════════
  # Delete or comment out everything from "vault:" down to "# END [C]" below.
  # Full checklist: see [C] at the TOP OF THIS FILE.
  # ─────────────────────────────────────────────────────────────────────────────

  vault:
    image: hashicorp/vault:latest
    container_name: atk-vault
    user: root
    entrypoint: ["vault", "server", "-config=/vault/config/vault.hcl"]
    ports:
      - "8200:8200"                     # internal only — public access is
                                        # https://vault-atkdev.fd.com (via nginx:443)
    volumes:
      - vault_data:/vault/data          # secrets are persisted here
      - ./config/vault.hcl:/vault/config/vault.hcl:ro
    networks:
      - atk-network
    restart: unless-stopped
    # FIRST BOOT: Vault starts SEALED. You must:
    #   1. docker exec -it atk-vault vault operator init
    #   2. docker exec -it atk-vault vault operator unseal  (run 3x with unseal keys)
    #   3. Log into Vault UI at https://vault-atkdev.fd.com with root token
    #   4. Create secret with LLM credentials (MODEL, BASE_URL, API_KEY, etc.)
    # After first boot the vault_data volume retains state across restarts.
  # END [C] vault ───────────────────────────────────────────────────────────────

  # ─── IDENTITY ────────────────────────────────────────────────────────────────

  keycloak:
    image: atkcontainerhub.jfrog.io/atk-main-2-3/atk-maf:keycloak_2.3.1
    container_name: atk-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}                   # set in .env
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD} # set in .env
      KC_PROXY_HEADERS: xforwarded         # required — keycloak sits behind nginx
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HTTP_RELATIVE_PATH: /auth         # keycloak served under /auth/ subpath —
                                           # kept as-is so no frontend/backend code changes
      KC_HOSTNAME: https://${KEYCLOAK_DNS}/auth   # SSO_DNS_NAME set in .env
                                                  # => https://sso-atkdev.fd.com/auth
                                                  # public URL keycloak puts in tokens,
                                                  # redirects and the OIDC discovery doc
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://10.106.6.16:5432/${KEYCLOAK_DB}
      # [B] EXISTING POSTGRES? Change "postgres" above to your DB host:
      #     KC_DB_URL: jdbc:postgresql://<your-db-host>:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}   # set in .env
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASS}   # set in .env
    ports:
      - "8080:8080"
    #depends_on:
    #  postgres:
    #    condition: service_healthy
      # [B] EXISTING POSTGRES? Remove the two lines above (postgres depends_on)
    networks:
      - atk-network
    restart: unless-stopped
    command: start-dev

  # ─── LLM PROXY ───────────────────────────────────────────────────────────────

  litellm:
    image: atkcontainerhub.jfrog.io/atk-main-2-3/atk-maf:litellm_2.3.1
    container_name: atk-litellm
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}       # set in .env — used to call LiteLLM API
      UI_USERNAME: ${LITELLM_UI_USERNAME}             # set in .env — LiteLLM admin UI login
      UI_PASSWORD: ${LITELLM_UI_PASSWORD}             # set in .env
      STORE_MODEL_IN_DB: "true"                       # stores model configs in litellm_db
      TRUST_PROXY_HEADERS: "true"                     # required — litellm sits behind nginx
      LITELLM_PUBLIC_BASE_URL: https://${BACKEND_DNS}/litellm
                                                      # => https://backend-atkdev.fd.com/litellm
      DATABASE_URL: postgresql://${LITELLM_DB_USER}:${LITELLM_DB_PASS}@10.106.6.16:5432/${LITELLM_DB}
      # [B] EXISTING POSTGRES? Change "postgres" above to your DB host:
      #     DATABASE_URL: postgresql://${LITELLM_DB_USER}:${LITELLM_DB_PASS}@<your-db-host>:5432/${LITELLM_DB}
      SERVER_ROOT_PATH: /litellm         # tells LiteLLM it is served under /litellm subpath
    ports:
      - "4000:4000"
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml
      # config/litellm_config.yaml also has database_url — update that file too
      # if using existing postgres [B]
    #depends_on:
    #  postgres:
    #    condition: service_healthy
      # [B] EXISTING POSTGRES? Remove the two lines above (postgres depends_on)
    networks:
      - atk-network
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--detailed_debug"]

  # ─── AGENT GATEWAY ─────────────────────────────────────────────────────────
  # Published as sub-paths of the backend DNS:
  #   UI      -> https://${BACKEND_DNS}/ui/
  #   Engine  -> https://${BACKEND_DNS}/agentgateway/  and  /mcp

  agentgateway-engine:
    image: atkcontainerhub.jfrog.io/atk-main-2-3/atk-maf:agentgateway_engine_2.3.1
    container_name: atk-agentgateway-engine
    environment:
      ADMIN_ADDR: "0.0.0.0:15000"
    ports:
      - "${AGENT_GATEWAY_PORT:-13000}:3000"
      - "${AGENT_GATEWAY_ADMIN_PORT:-15000}:15000"
      - "15021:15021"
    volumes:
      - ./config/config-agent-gateway.yaml:/config.yaml
      - agentgateway_data:/data
    depends_on:
      keycloak:
        condition: service_started
    networks:
      - atk-network
    restart: unless-stopped
    command: ["--file", "/config.yaml"]

  agentgateway-ui:
    image: atkcontainerhub.jfrog.io/atk-main-2-3/atk-maf:agentgateway_ui_2.3.1
    container_name: atk-agentgateway-ui
    environment:
      ENGINE_ADMIN_UPSTREAM: agentgateway-engine:15000
      KEYCLOAK_URL: https://${KEYCLOAK_DNS}/auth
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_AGW_CLIENT_ID:-agw-cli}
    ports:
      - "${AGENT_GATEWAY_UI_PORT:-19000}:19000"
    depends_on:
      agentgateway-engine:
        condition: service_started
    networks:
      - atk-network
    restart: unless-stopped

  # ─── BACKEND ─────────────────────────────────────────────────────────────────

  backend:
    image: atkcontainerhub.jfrog.io/atk-main-2-3/atk-maf:backend_2.3.2
    container_name: atk-backend
    environment:
      PORT: "8000"
      MIM_APP_PORT: "${MIM_APP_PORT:-3978}"
      ENVIRONMENT: production
      # Frontend is on a DIFFERENT origin (https://atkdev.fd.com) than this API
      # (https://backend-atkdev.fd.com), so every browser call is cross-origin.
      # "*" keeps it working; narrow it to https://atkdev.fd.com if you prefer.
      CORS_ORIGINS: "*"
      ALLOWED_ORIGINS: "*"

      # ── Database ──────────────────────────────────────────────────────────────
      DB_HOST: 10.106.6.16          # [B] EXISTING POSTGRES? Change to your DB host/IP
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}   # set in .env
      PGDB_HOST: 10.106.6.16        # [B] EXISTING POSTGRES? Change to your DB host/IP
                                 #     (same as DB_HOST — two naming conventions supported)
      PGDB_PORT: "5432"
      PGDB_NAME: ${POSTGRES_DB} # set in .env

      # ── ServiceNow scope enforcement ──────────────────────────────────────────
      # Under service-account auth every ATK user reaches ServiceNow as the same
      # account, so ServiceNow cannot tell them apart. This makes the backend
      # append a mandatory ownership clause (assigned to me / my groups / opened
      # by me) to every browser-originated ServiceNow query, and deny tables that
      # are not on the allowlist. It restores the guarantee ATK 2.1 had, where
      # the browser never got to choose the query.
      #
      #   on  (default) - enforce. Correct for service-account deployments.
      #   off           - passthrough. ONLY safe once ServiceNow authenticates
      #                   each user itself (serviceNow.api.mode = "direct"),
      #                   because then ServiceNow applies its own ACLs.
      #
      # Deliberately a backend env var, not frontend config - a browser must not
      # be able to influence it.
      SNOW_SCOPE_ENFORCEMENT: "${SNOW_SCOPE_ENFORCEMENT:-on}"
      # Seconds to cache a caller's sys_id / assignment groups / readable KBs.
      # Higher = fewer lookups per request; lower = group changes apply sooner.
      SNOW_SCOPE_CACHE_TTL: "${SNOW_SCOPE_CACHE_TTL:-60}"

      # ── Vector / similarity (do not change these) ─────────────────────────────
      VECTOR_DIM: "1536"
      DUPLICATE_THRESHOLD: "0.9"
      SIMILARITY_THRESHOLD: "0.7"
      PASS_THRESHOLD: "0.7"
      PROACTIVE_PROBLEM_ANALYSIS_DAYS: "${PROACTIVE_PROBLEM_ANALYSIS_DAYS:-30}"
      # Agent Gateway (container-to-container, stays inside the docker network)
      AGENT_GATEWAY_URL: http://agentgateway-engine:3000/agent-gateway

      # ── ITSM / ServiceNow ─────────────────────────────────────────────────────
      SNOW_URL: ${SNOW_URL}     # set in .env — your ServiceNow instance URL
      INC_TIMELINE: "30"        # how many days of incidents to fetch
      KB_BASES: ${KB_BASES}     # set in .env — comma-separated KB base names to sync
      KB_FIELDS: ${KB_FIELDS}   # set in .env — KB fields to index for RAG

      # ── Keycloak ──────────────────────────────────────────────────────────────
      KEYCLOAK_URL: http://keycloak:8080/auth   # internal Docker URL — do not change.
                                                # Keycloak is in this same compose
                                                # project, so the backend validates
                                                # tokens over the private network and
                                                # never needs sso-atkdev.fd.com.
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}         # set in .env
      KEYCLOAK_REDIRECTION_URL: https://${FRONTEND_DNS}/
      SA_CLIENT_ID: "${SA_CLIENT_ID}"
      SA_CLIENT_SECRET: "${SA_CLIENT_SECRET}"
      TWILIO_PHONE_NUMBER_FROM: "${TWILIO_PHONE_NUMBER_FROM}"

      # ── LLM (leave blank — fetched from Vault at runtime) ────────────────────
      # [C] These are populated by the backend reading config/.vault_env and
      #     calling your Vault server. Do NOT set them here.
      MODEL: ""
      BASE_URL: ""
      API_TYPE: ""
      AZ_API_VERSION: ""
      API_VERSION: ""
      PROXY: ""
      SECRET_MANAGER_NAME: ""
      SECRET_MANAGER_REGION: ""

    ports:
      - "8000:8000"
      - "${MIM_APP_PORT:-3978}:${MIM_APP_PORT:-3978}"

    volumes:
      # ── Entrypoint: starts MCP server on port 6000, then FastAPI ─────────────
      #- ./entrypoint.sh:/app/entrypoint.sh
      # Hotfix: override main.py
      - ./config/vite.config.ts:/app/vite.config.ts:ro

      # ── Vault credentials ─────────────────────────────────────────────────────
      # [C] EXISTING VAULT? Update VAULT_URL and VAULT_TOKEN in .vault_env
      #     to point to your external Vault server instead of http://vault:8200
      - ./config/.vault_env:/app/config/.vault_env:ro
      - ./config/.vault_type:/app/config/.vault_type:ro
      - ./hotfix/db_models.py:/app/database/db_models.py
      - ./hotfix/servicenow_mcp.py:/app/mcp_servers/servicenow_mcp.py
      - ./hotfix/kb_sync.py:/app/modules/knowledge_assist/utils/kb_sync.py
      - ./hotfix/auth_handler.py:/app/modules/auth/utils/auth_handler.py

      # ── ServiceNow proxy (service-account auth for browser-originated calls) ──
      # The frontend no longer calls ServiceNow directly — it calls the backend,
      # which authenticates downstream using the ITSM connector credentials
      # (basic auth for Service Account, bearer for OAuth — chosen by
      # itsm_auth_type). These two add the attachment + stats passthrough and
      # the sys_id / query_string params the frontend rewrite relies on.
      #
      # !! VERIFY BEFORE FIRST USE — these are built from repo source, while the
      #    container runs image backend_2.3.2. Confirm there is no drift:
      #      docker cp atk-backend:/app/modules/incident_assist/routers/incident_assist_routers.py /tmp/img_routers.py
      #      diff /tmp/img_routers.py ./hotfix/incident_assist_routers.py
      #    Expect ONLY the proxy additions. Anything else means the image has
      #    moved on from this source tree — reconcile before mounting.
      - ./hotfix/servicenow_proxy.py:/app/modules/incident_assist/utils/servicenow_proxy.py
      - ./hotfix/incident_assist_routers.py:/app/modules/incident_assist/routers/incident_assist_routers.py

      # ── Keycloak backend client credentials ───────────────────────────────────
      # CLIENT_ID and CLIENT_SECRET for backend to call Keycloak API
      - ./config/.keycloak_env:/app/config/.keycloak_env:ro

      # ── ServiceNow credentials ────────────────────────────────────────────────
      - ./config/.itsm_env:/app/config/.itsm_env:ro

      # ── Per-module AI system prompts ──────────────────────────────────────────
      # Mounted read-write (no :ro) — the admin console writes prompt changes back
      # to these files through the backend. Changes are live immediately; no restart
      # needed for prompt edits made via the UI.
      # Direct file edits on the host also work — restart backend to reload those.
      - ./system_prompts/change_assist.yaml:/app/modules/change_assist/config/system_prompts.yaml
      - ./system_prompts/incident_assist.yaml:/app/modules/incident_assist/config/system_prompts.yaml
      - ./system_prompts/knowledge_assist.yaml:/app/modules/knowledge_assist/config/system_prompts.yaml
      - ./system_prompts/meeting_assist.yaml:/app/modules/meeting_assist/config/system_prompts.yaml
      - ./system_prompts/problem_assist.yaml:/app/modules/problem_assist/config/system_prompts.yaml
      - ./system_prompts/train_assist.yaml:/app/modules/train_assist/config/system_prompts.yaml
      - ./system_prompts/mim_assist.yaml:/app/modules/mim_assist/config/system_prompts.yaml
      # MIM Assist shift roster template
      - ./config/shift_roaster.xlsx:/app/modules/mim_assist/config/shift_roaster.xlsx

    depends_on:
     # postgres:
     #   condition: service_healthy
      # [B] EXISTING POSTGRES? Remove the two lines above (postgres depends_on)
      vault:
        condition: service_started
      # [C] EXISTING VAULT? Remove the two lines above (vault depends_on)
      keycloak:
        condition: service_started

     # agentgateway-engine:
     #   condition: service_started
    networks:
      - atk-network
    restart: unless-stopped

  # ─── KB SYNC CRON JOB ────────────────────────────────────────────────────────
  # Syncs KB articles from ServiceNow into the postgres vector store on a schedule.
  # Incident Assist RAG search depends on this data being present.
  # On first deploy run manually: docker exec atk-kb-sync python3 /app/modules/knowledge_assist/utils/kb_sync.py initial

  kb-sync:
    image: atkcontainerhub.jfrog.io/atk-main-2-3/atk-maf:backend_2.3.2
    container_name: atk-kb-sync
    entrypoint: ""
    # Sleep interval between runs — adjust to your desired frequency:
    #   604800 = every 7 days
    #    86400 = every day
    #    21600 = every 6 hours
    command: >
      sh -c "
        echo 'KB sync scheduler started' &&
        while true; do
          python3 /app/modules/knowledge_assist/utils/kb_sync.py initial;
          echo 'Next run in 7 days';
          sleep 604800;
        done
      "
    environment:
      DB_HOST: 10.106.6.16          # [B] EXISTING POSTGRES? Change to your DB host/IP
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      PGDB_HOST: 10.106.6.16        # [B] EXISTING POSTGRES? Change to your DB host/IP
      PGDB_PORT: "5432"
      PGDB_NAME: ${POSTGRES_DB}
      SNOW_URL: ${SNOW_URL}
      KB_BASES: ${KB_BASES}
      KB_FIELDS: ${KB_FIELDS}
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
    volumes:
      # [C] EXISTING VAULT? Update VAULT_URL in .vault_env to your external Vault
      - ./config/.vault_env:/app/config/.vault_env:ro
      - ./config/.vault_type:/app/config/.vault_type:ro
      - ./config/.itsm_env:/app/config/.itsm_env:ro
    #depends_on:
      #postgres:
      #  condition: service_healthy
      # [B] EXISTING POSTGRES? Remove the two lines above (postgres depends_on)
    networks:
      - atk-network
    restart: unless-stopped

  # ─── OBSERVABILITY ───────────────────────────────────────────────────────────
  # Grafana has no DNS record of its own — it is served as a sub-path of the
  # backend DNS: https://backend-atkdev.fd.com/grafana

  grafana:
    image: atkcontainerhub.jfrog.io/atk-main-2-3/atk-maf:grafana_2.3.1
    container_name: atk-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}         # set in .env
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD} # set in .env
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: https://${BACKEND_DNS}/grafana
      # Frontend embeds/links Grafana from https://atkdev.fd.com — a different
      # origin. Allow it to frame Grafana, otherwise the browser blocks the iframe.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: none
      GF_SECURITY_COOKIE_SECURE: "true"
    ports:
      - "3000:3000"
      - "5327:4317"   # OTLP gRPC — receives traces from backend
      - "5328:4318"   # OTLP HTTP — receives traces from backend
    volumes:
      - grafana_data:/data
      # NOTE: this mount path is inherited verbatim from the single-VM compose
      # file. /etc/nginx/ is not where Grafana looks for its config, so the file
      # is effectively inert — the GF_* environment variables above are what
      # actually configure Grafana. config/grafana.ini is kept in sync with them
      # for reference. If you want the file to take effect, change the target to
      # /etc/grafana/grafana.ini and fill in <Grafana Admin Password> in it
      # first, otherwise the admin login will break.
      - ./config/grafana.ini:/etc/nginx/grafana.ini:ro
    networks:
      - atk-network
    restart: unless-stopped

  # ─── REVERSE PROXY ───────────────────────────────────────────────────────────
  # Single nginx, three name-based virtual hosts on port 443:
  #   sso-atkdev.fd.com     -> keycloak
  #   vault-atkdev.fd.com   -> vault
  #   backend-atkdev.fd.com -> backend + grafana + litellm
  # See config/nginx.conf.
  #
  # Port 8443 is no longer used — Vault now has its own DNS name on 443.

  nginx:
    image: atkcontainerhub.jfrog.io/atk-main-2-3/atk-maf:nginx_2.3.1  #nginx:alpine
    container_name: atk-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      # ssl/: place your wildcard *.fd.com fullchain.pem and privkey.pem here.
      # The same pair is used by all three server blocks.
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      #- backend
      - keycloak
      #- litellm
      #- grafana
      - vault        # [C] EXISTING VAULT? Remove this line
      #- agentgateway-engine
      #- agentgateway-ui
    networks:
      - atk-network
    restart: unless-stopped

# ─── NETWORKS ─────────────────────────────────────────────────────────────────

networks:
  atk-network:
    driver: bridge

# ─── VOLUMES ──────────────────────────────────────────────────────────────────
# Named volumes persist data across container restarts and removals.
# WARNING: "docker compose down -v" deletes all volumes and ALL data.

volumes:
  #postgres_data:        # [B] EXISTING POSTGRES? Remove this line
  vault_data:           # [C] EXISTING VAULT?    Remove this line
  grafana_data:
  agentgateway_data:
